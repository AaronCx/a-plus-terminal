name: aPlusTerminal
options:
  bundleIdPrefix: com.aaroncx
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # One source of truth for both targets — the app and widget MUST ship with
    # identical versions or App Store Connect rejects the upload.
    CURRENT_PROJECT_VERSION: 45
    MARKETING_VERSION: "1.0.3"
packages:
  # Pinned for reproducible builds of a security-sensitive SSH client: `from:`
  # floats to the latest matching tag, so CI and each developer could silently
  # resolve a different version of the SSH/terminal stack.
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    minorVersion: "0.12.1"   # >=0.12.1, <0.13.0 — patch updates only
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    # Hard-pinned: TerminalEmulatorView documents a workaround for a glyph bug
    # whose upstream fix landed *after* 1.13.0, so a 1.x bump must be deliberate.
    exactVersion: "1.13.0"
  # VNC monitor sessions (view-only). Vendored as a git submodule pinned to
  # the 1.1.0 tag commit and consumed as a LOCAL package, because the 1.1.0
  # manifest declares a branch-based CryptoSwift dependency — SPM forbids
  # branch deps inside version-pinned dependencies, so a normal `exact:
  # 1.1.0` reference fails resolution. This mirrors the vendor's own iOS
  # demo. MIT licensed (transitives: CryptoSwift fork, system zlib, d3des).
  RoyalVNCKit:
    path: Vendor/royalvnc
  # Resumable terminal transport (opt-in, Settings toggle). Aaron's own MIT,
  # clean-room, zero-dependency package. Only the CLIENT half is linked here —
  # MeshyyCore (wire format) and MeshyyKit (session/transport); the daemon
  # targets are macOS-only and never reach the phone.
  #
  # Exact-pinned for the same reason as SwiftTerm: this carries the PTY byte
  # stream when enabled, and a floating version could change resume arithmetic
  # under a shipped build.
  Meshyy:
    url: https://github.com/AaronCx/meshyy.git
    exactVersion: "0.1.0"
targets:
  aPlusTerminal:
    type: application
    platform: iOS
    entitlements:
      path: aPlusTerminal/aPlusTerminal.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aaroncx.aplusterminal
    sources:
      - aPlusTerminal
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: aPlusTerminalWidgets
      - package: Citadel
      - package: SwiftTerm
      - package: RoyalVNCKit
      - package: Meshyy
        product: MeshyyKit
      - package: Meshyy
        product: MeshyyCore
    settings:
      base:
        # Locks into App Store Connect at first upload — do not rename after that.
        PRODUCT_BUNDLE_IDENTIFIER: com.aaroncx.aplusterminal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # XcodeGen's per-target default is "1,2"; this app is iPhone-only.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Empty by default (automatic signing). The TestFlight upload script
        # passes CODE_SIGN_STYLE=Manual and these per-target profile names.
        PROVISIONING_PROFILE_SPECIFIER: "$(APLUSTERMINAL_PROFILE_APP)"
    info:
      path: aPlusTerminal/Info.plist
      properties:
        CFBundleDisplayName: a+Terminal
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        # "Audio, AirPlay, and Picture in Picture" — required for Pop-Out
        # Sessions (view-only PiP session monitor). No entitlement needed.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "a+Terminal browses your local network for SSH servers you choose to add, checks whether your saved servers are reachable, and sends wake packets when you ask. Everything stays on your network — nothing is collected."
        NSBonjourServices:
          - _ssh._tcp.
        NSMicrophoneUsageDescription: "a+Terminal uses the microphone for voice dictation into your terminal. Audio is processed entirely on this device and never uploaded anywhere."
        NSSpeechRecognitionUsageDescription: "a+Terminal transcribes dictation on-device only. Your speech never leaves this iPhone — a+Terminal never falls back to server-based recognition."
        CFBundleURLTypes:
          - CFBundleURLName: com.aaroncx.aplusterminal
            CFBundleURLSchemes:
              - aplusterminal
  aPlusTerminalWidgets:
    type: app-extension
    platform: iOS
    entitlements:
      path: aPlusTerminalWidgets/aPlusTerminalWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aaroncx.aplusterminal
    sources:
      - aPlusTerminalWidgets
      # Shared with the app target — must compile identically in both.
      - path: aPlusTerminal/LiveActivity/SessionActivityAttributes.swift
      - path: aPlusTerminal/Servers/Server.swift
      - path: aPlusTerminal/Servers/ServerStore.swift
      - path: aPlusTerminal/Network/Reachability.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaroncx.aplusterminal.widgets
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: "$(APLUSTERMINAL_PROFILE_WIDGET)"
    info:
      path: aPlusTerminalWidgets/Info.plist
      properties:
        CFBundleDisplayName: a+Terminal Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  aPlusTerminalTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - aPlusTerminalTests
    dependencies:
      - target: aPlusTerminal
      # Compile against Citadel but resolve symbols from the host app binary
      # at run time — linking the package twice breaks the test bundle link.
      - package: Citadel
        link: false
      # Static product (see Vendor/royalvnc/Package.swift header): compile
      # against it, resolve symbols from the host app binary at run time —
      # linking it twice would duplicate the code, the Citadel pattern.
      - package: RoyalVNCKit
        link: false
  aPlusTerminalUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Both default to today's values (automatic signing, bare id). An
        # on-device live-QA run overrides BOTH on the command line: bundle id
        # com.aaroncx.aPlusTerminalUITests.qa + the DevLab wildcard profile
        # (com.aaroncx.aPlusTerminalUITests.*), which then covers the test
        # bundle AND the generated .xctrunner app under manual signing.
        APLUSTERMINAL_UITESTS_BUNDLE_ID: com.aaroncx.aPlusTerminalUITests
        PRODUCT_BUNDLE_IDENTIFIER: "$(APLUSTERMINAL_UITESTS_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(APLUSTERMINAL_PROFILE_UITESTS)"
    sources:
      - aPlusTerminalUITests
    dependencies:
      - target: aPlusTerminal
schemes:
  aPlusTerminal:
    build:
      targets:
        aPlusTerminal: all
    run:
      config: Debug
      # Local StoreKit config so the tips are testable in the
      # simulator without App Store Connect.
      storeKitConfiguration: aPlusTerminal.storekit
    test:
      config: Debug
      storeKitConfiguration: aPlusTerminal.storekit
      # Live QA suites read these from the process hosting the tests. The
      # `TEST_RUNNER_`-prefixed recipe still quoted in their headers does NOT
      # reach a UI test runner on Xcode 26 (verified 2026-07-28: the runner's
      # environment holds only TESTMANAGERD_*), so the scheme forwards build
      # settings instead. Pass them unprefixed to xcodebuild:
      #   xcodebuild test ... APLUSTERMINAL_LIVE_QA=1 APLUSTERMINAL_TEST_SERVER=...
      # Unset by default, which is what keeps every live suite skipped on CI.
      environmentVariables:
        APLUSTERMINAL_LIVE_QA: $(APLUSTERMINAL_LIVE_QA)
        APLUSTERMINAL_TEST_SERVER: $(APLUSTERMINAL_TEST_SERVER)
        APLUSTERMINAL_TEST_PRIVATE_KEY: $(APLUSTERMINAL_TEST_PRIVATE_KEY)
        APLUSTERMINAL_SCREENSHOTS: $(APLUSTERMINAL_SCREENSHOTS)
        APLUSTERMINAL_SHOT_PORT: $(APLUSTERMINAL_SHOT_PORT)
        APLUSTERMINAL_TEST_VNC_SERVER: $(APLUSTERMINAL_TEST_VNC_SERVER)
        APLUSTERMINAL_TEST_VNC_PASSWORD: $(APLUSTERMINAL_TEST_VNC_PASSWORD)
      targets:
        - aPlusTerminalTests
        - aPlusTerminalUITests
