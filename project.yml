name: aPlusTerminal
options:
  bundleIdPrefix: com.aaroncx
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # One source of truth for both targets — the app and widget MUST ship with
    # identical versions or App Store Connect rejects the upload.
    CURRENT_PROJECT_VERSION: 76
    MARKETING_VERSION: "1.0.4"
    # Agent notifications are compiled OUT on this branch: this switch is
    # empty, and `#if AGENT_NOTIFY` removes every entry point (posting for
    # bells / OSC 9 / 777 / 7501, the notification delegate) together with
    # the permission ask (AgentAlertCenter.agentDetected and
    # sendTestNotification, the only requestAuthorization calls) and the UI
    # (the Claude Code setup card, Settings → Notifications). What stays
    # compiled is unreachable: AgentAlertPolicy and AgentAlertCenter's
    # posting shell, kept so the policy's unit tests still run.
    # Setting it to AGENT_NOTIFY turns the condition on in BOTH app targets
    # and all three test targets at once and restores develop's code (each
    # gated hunk is develop's text); the notification work itself is
    # preserved unchanged on branch test/agent-notifications. It is a plain build setting rather than a
    # condition here because a project-level SWIFT_ACTIVE_COMPILATION_CONDITIONS
    # would drop Debug's `DEBUG` (see the MESHYY note on the aPlusTerminal
    # target). The agent-status heuristic (badge, Live Activity, Dynamic
    # Island) and custom agents are NOT behind it.
    AGENT_NOTIFY_CONDITION: ""
packages:
  # Pinned for reproducible builds of a security-sensitive SSH client: `from:`
  # floats to the latest matching tag, so CI and each developer could silently
  # resolve a different version of the SSH/terminal stack.
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    minorVersion: "0.12.1"   # >=0.12.1, <0.13.0 — patch updates only
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    # Hard-pinned: TerminalEmulatorView documents a workaround for a glyph bug
    # whose upstream fix landed *after* 1.13.0, so a 1.x bump must be deliberate.
    exactVersion: "1.13.0"
  # VNC monitor sessions (view-only). Vendored as a git submodule pinned to
  # the 1.1.0 tag commit and consumed as a LOCAL package, because the 1.1.0
  # manifest declares a branch-based CryptoSwift dependency — SPM forbids
  # branch deps inside version-pinned dependencies, so a normal `exact:
  # 1.1.0` reference fails resolution. This mirrors the vendor's own iOS
  # demo. MIT licensed (transitives: CryptoSwift fork, system zlib, d3des).
  RoyalVNCKit:
    path: Vendor/royalvnc
  # Resumable terminal transport, opt-in via a Settings toggle — BETA ONLY: linked
  # by the aPlusTerminal (TestFlight) target, never by aPlusTerminalAppStore. Kept
  # declared here so Package.resolved stays identical for both. Aaron's own MIT,
  # clean-room, zero-dependency package. Only the CLIENT half is linked — MeshyyCore
  # (wire format) and MeshyyKit (session/transport); the daemon targets are macOS-only.
  #
  # Exact-pinned like SwiftTerm: this carries the pty byte stream when enabled, and a
  # floating version could change resume arithmetic under a shipped build.
  Meshyy:
    url: https://github.com/AaronCx/meshyy.git
    exactVersion: "0.1.22"
# The app target's body lives in a template so the App Store candidate can be
# the SAME app minus meshyy (brief 1.0.4 §1: App Review tests the uploaded
# binary, and guideline 2.3.1 forbids dormant features, so a runtime "off"
# isn't enough). Two targets, one template:
#   aPlusTerminal          beta/TestFlight — links Meshyy and compiles with
#                          MESHYY. What develop, CI, Run and Test use.
#   aPlusTerminalAppStore  App Store candidate — no Meshyy package, no MESHYY.
#                          Same bundle id, Info.plist, entitlements and widget.
# Every meshyy entry point in the sources is wrapped in `#if MESHYY`.
targetTemplates:
  aPlusTerminalApp:
    type: application
    platform: iOS
    entitlements:
      path: aPlusTerminal/aPlusTerminal.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aaroncx.aplusterminal
    sources:
      - aPlusTerminal
      - path: Resources
        buildPhase: resources
      # Agent mascot marks — shared with the widget so the Live Activity can
      # draw the same icon the app shows.
      - path: AgentIcons.xcassets
        buildPhase: resources
    dependencies:
      - target: aPlusTerminalWidgets
      - package: Citadel
      - package: SwiftTerm
      - package: RoyalVNCKit
    settings:
      base:
        # Locks into App Store Connect at first upload — do not rename after that.
        PRODUCT_BUNDLE_IDENTIFIER: com.aaroncx.aplusterminal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # XcodeGen's per-target default is "1,2"; this app is iPhone-only.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Empty by default (automatic signing). The TestFlight upload script
        # passes CODE_SIGN_STYLE=Manual and these per-target profile names.
        PROVISIONING_PROFILE_SPECIFIER: "$(APLUSTERMINAL_PROFILE_APP)"
    info:
      path: aPlusTerminal/Info.plist
      properties:
        CFBundleDisplayName: a+Terminal
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        # "Audio, AirPlay, and Picture in Picture" — required for Pop-Out
        # Sessions (view-only PiP session monitor). No entitlement needed.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "a+Terminal browses your local network for SSH servers you choose to add, checks whether your saved servers are reachable, and sends wake packets when you ask. Everything stays on your network — nothing is collected."
        NSBonjourServices:
          - _ssh._tcp.
        NSMicrophoneUsageDescription: "a+Terminal uses the microphone for voice dictation into your terminal. Audio is processed entirely on this device and never uploaded anywhere."
        NSSpeechRecognitionUsageDescription: "a+Terminal transcribes dictation on-device only. Your speech never leaves this iPhone — a+Terminal never falls back to server-based recognition."
        CFBundleURLTypes:
          - CFBundleURLName: com.aaroncx.aplusterminal
            CFBundleURLSchemes:
              - aplusterminal
targets:
  aPlusTerminal:
    templates: [aPlusTerminalApp]
    dependencies:
      - package: Meshyy
        product: MeshyyKit
      - package: Meshyy
        product: MeshyyCore
    settings:
      base:
        # Target level, not project level: here `$(inherited)` picks up the
        # project's Debug `DEBUG`, which a project-level base value would drop.
        # AGENT_NOTIFY_CONDITION: empty on this branch (agent notifications
        # compiled out); AGENT_NOTIFY restores them — see the project settings.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MESHYY $(AGENT_NOTIFY_CONDITION)"
  aPlusTerminalAppStore:
    templates: [aPlusTerminalApp]
    settings:
      base:
        # No MESHYY, ever. AGENT_NOTIFY follows the project-level switch.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(AGENT_NOTIFY_CONDITION)"
      configs:
        # Release (what Archive uses) is named exactly like the beta app, so
        # the archived .app, its binary and the Swift module are aPlusTerminal
        # either way. Archives build in per-scheme ArchiveIntermediates, so
        # the two never meet there.
        Release:
          PRODUCT_NAME: aPlusTerminal
          PRODUCT_MODULE_NAME: aPlusTerminal
        # Debug keeps its own name. Both schemes build into ONE products
        # directory, and with a shared name the second scheme's build finds
        # the first one's aPlusTerminal.debug.dylib "up to date" and skips the
        # link: measured, the beta app then ran the App Store code (zero
        # meshyy strings) and vice versa. Distinct names make that impossible.
        Debug:
          PRODUCT_NAME: aPlusTerminalAppStore
  aPlusTerminalWidgets:
    type: app-extension
    platform: iOS
    entitlements:
      path: aPlusTerminalWidgets/aPlusTerminalWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aaroncx.aplusterminal
    sources:
      - aPlusTerminalWidgets
      - path: AgentIcons.xcassets
        buildPhase: resources
      # Shared with the app target — must compile identically in both. The
      # widget never defines MESHYY: it only reads servers.json (never writes
      # it), so Server's meshyy-only field is simply absent here.
      - path: aPlusTerminal/LiveActivity/SessionActivityAttributes.swift
      - path: aPlusTerminal/LiveActivity/SessionSnapshotStore.swift
      - path: aPlusTerminal/Servers/Server.swift
      - path: aPlusTerminal/Servers/ServerStore.swift
      - path: aPlusTerminal/Network/Reachability.swift
      # Custom agent icons: the widget reads the same App Group file the app
      # writes, through the same code (path, id guard, generic fallback).
      - path: aPlusTerminal/Profiles/AgentProfile.swift
      - path: aPlusTerminal/Profiles/CustomAgentIconStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaroncx.aplusterminal.widgets
        TARGETED_DEVICE_FAMILY: "1"
        PROVISIONING_PROFILE_SPECIFIER: "$(APLUSTERMINAL_PROFILE_WIDGET)"
    info:
      path: aPlusTerminalWidgets/Info.plist
      properties:
        CFBundleDisplayName: a+Terminal Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  aPlusTerminalTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Hosted by the beta app, so the meshyy suites compile and run here.
        # The notification suites follow the app's AGENT_NOTIFY switch.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MESHYY $(AGENT_NOTIFY_CONDITION)"
    sources:
      - aPlusTerminalTests
    dependencies:
      - target: aPlusTerminal
      # Compile against Citadel but resolve symbols from the host app binary
      # at run time — linking the package twice breaks the test bundle link.
      - package: Citadel
        link: false
      # Static product (see Vendor/royalvnc/Package.swift header): compile
      # against it, resolve symbols from the host app binary at run time —
      # linking it twice would duplicate the code, the Citadel pattern.
      - package: RoyalVNCKit
      - package: Meshyy
        product: MeshyyKit
      - package: Meshyy
        product: MeshyyCore
        link: false
  aPlusTerminalUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Both default to today's values (automatic signing, bare id). An
        # on-device live-QA run overrides BOTH on the command line: bundle id
        # com.aaroncx.aPlusTerminalUITests.qa + the DevLab wildcard profile
        # (com.aaroncx.aPlusTerminalUITests.*), which then covers the test
        # bundle AND the generated .xctrunner app under manual signing.
        APLUSTERMINAL_UITESTS_BUNDLE_ID: com.aaroncx.aPlusTerminalUITests
        PRODUCT_BUNDLE_IDENTIFIER: "$(APLUSTERMINAL_UITESTS_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(APLUSTERMINAL_PROFILE_UITESTS)"
        # The notification UI suites follow the app's AGENT_NOTIFY switch.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(AGENT_NOTIFY_CONDITION)"
    sources:
      - aPlusTerminalUITests
      # The form walker shared with the App Store UI test (BetaBuildSettingsUITests
      # is its mirror, so both must walk identically).
      - path: aPlusTerminalAppStoreUITests/SettingsFormWalker.swift
    dependencies:
      - target: aPlusTerminal
  # UI tests against the App Store candidate (TEST_TARGET_NAME =
  # aPlusTerminalAppStore): proves the shipped Settings has no meshyy row.
  aPlusTerminalAppStoreUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aaroncx.aPlusTerminalAppStoreUITests
        # Follows the app's AGENT_NOTIFY switch (the no-notifications check).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(AGENT_NOTIFY_CONDITION)"
    sources:
      - aPlusTerminalAppStoreUITests
    dependencies:
      - target: aPlusTerminalAppStore
schemes:
  aPlusTerminal:
    build:
      targets:
        aPlusTerminal: all
    run:
      config: Debug
      # Local StoreKit config so the tips are testable in the
      # simulator without App Store Connect.
      storeKitConfiguration: aPlusTerminal.storekit
    test:
      config: Debug
      storeKitConfiguration: aPlusTerminal.storekit
      # Live QA suites read these from the process hosting the tests. The
      # `TEST_RUNNER_`-prefixed recipe still quoted in their headers does NOT
      # reach a UI test runner on Xcode 26 (verified 2026-07-28: the runner's
      # environment holds only TESTMANAGERD_*), so the scheme forwards build
      # settings instead. Pass them unprefixed to xcodebuild:
      #   xcodebuild test ... APLUSTERMINAL_LIVE_QA=1 APLUSTERMINAL_TEST_SERVER=...
      # Unset by default, which is what keeps every live suite skipped on CI.
      environmentVariables:
        APLUSTERMINAL_LIVE_QA: $(APLUSTERMINAL_LIVE_QA)
        APLUSTERMINAL_TEST_SERVER: $(APLUSTERMINAL_TEST_SERVER)
        APLUSTERMINAL_TEST_PRIVATE_KEY: $(APLUSTERMINAL_TEST_PRIVATE_KEY)
        APLUSTERMINAL_SCREENSHOTS: $(APLUSTERMINAL_SCREENSHOTS)
        APLUSTERMINAL_SHOT_PORT: $(APLUSTERMINAL_SHOT_PORT)
        APLUSTERMINAL_TEST_VNC_SERVER: $(APLUSTERMINAL_TEST_VNC_SERVER)
        APLUSTERMINAL_TEST_VNC_PASSWORD: $(APLUSTERMINAL_TEST_VNC_PASSWORD)
        # Agent-notification live tests: the DEBUG alert probe and a floor
        # override (seconds) so repeated posts are counted, not rate-limited.
        APLUSTERMINAL_TEST_ALERT_PROBE: $(APLUSTERMINAL_TEST_ALERT_PROBE)
        APLUSTERMINAL_TEST_ALERT_FLOOR: $(APLUSTERMINAL_TEST_ALERT_FLOOR)
        # Custom agents seams (TestSeed.prepareAgentsIfRequested). The Agents
        # UI tests set these on the launched app directly; forwarding them
        # here also lets a manual run seed the app under test.
        APLUSTERMINAL_TEST_AGENT_PROFILES: $(APLUSTERMINAL_TEST_AGENT_PROFILES)
        APLUSTERMINAL_TEST_RESET_AGENTS: $(APLUSTERMINAL_TEST_RESET_AGENTS)
        APLUSTERMINAL_TEST_AGENT_ICON_ID: $(APLUSTERMINAL_TEST_AGENT_ICON_ID)
        APLUSTERMINAL_TEST_AGENT_ICON_FILE: $(APLUSTERMINAL_TEST_AGENT_ICON_FILE)
        APLUSTERMINAL_TEST_IMPORT_AGENTS_JSON: $(APLUSTERMINAL_TEST_IMPORT_AGENTS_JSON)
        # iPhone Duo layout suite (DuoLayoutUITests): only duo.yml sets it,
        # with its loopback sshd and fold driver running.
        APLUSTERMINAL_DUO: $(APLUSTERMINAL_DUO)
      targets:
        - aPlusTerminalTests
        - aPlusTerminalUITests
  # The App Store candidate: `scripts/ship-testflight.sh N --app-store` archives
  # this scheme (Release). Its test action is the no-meshyy Settings UI test.
  aPlusTerminalAppStore:
    build:
      targets:
        aPlusTerminalAppStore: all
    run:
      config: Debug
      storeKitConfiguration: aPlusTerminal.storekit
    test:
      config: Debug
      targets:
        - aPlusTerminalAppStoreUITests
    archive:
      config: Release
