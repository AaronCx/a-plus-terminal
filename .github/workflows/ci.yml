name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same ref so stale (expensive, 10x-billed)
# macOS builds don't pile up on rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Network symbols stay in the audited layers
        run: scripts/check-network-surface.sh

      - name: Select Xcode
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      # Resolve SPM packages as an explicit, fail-fast step against the
      # committed Package.resolved, so a dependency-resolution problem is
      # distinguishable from a compile failure in the Build step below.
      - name: Resolve packages
        run: |
          make generate
          xcodebuild -project aPlusTerminal.xcodeproj -scheme aPlusTerminal -resolvePackageDependencies

      - name: Build
        run: make build

      - name: Test
        run: make test

      # The App Store candidate: the same app built WITHOUT meshyy. A broken
      # `#if MESHYY` gate fails here, not at release time. Same DerivedData
      # and simulator as the steps above, so the packages are already built.
      - name: Build App Store candidate (no meshyy)
        run: make build-appstore

      - name: App Store candidate Settings has no meshyy (UI test)
        run: make test-appstore

      - name: App Store candidate binary has no meshyy
        run: make check-appstore
