name: Duo (iOS 27.1 SDK)

# The iPhone Duo (foldable) needs the iOS 27.1 SDK and simulator, which only
# GitHub's xcode-27 image carries; main CI (ci.yml) stays on macos-26 with
# Xcode 26.x, so everything here must also compile there. One job builds both
# schemes for the Duo simulator and runs the unit tests on it; the other runs
# DuoLayoutUITests against a real loopback SSH session, with a host-side
# helper screenshotting both Duo displays at each step. Two jobs on two fresh
# VMs: the preview image's VMs have stalled mid-job, and a stall then takes
# the job's logs with it, so each job is kept short. Nothing here folds
# the simulator: `simctl io screenConfig ... power off` (its only scriptable
# fold control) wedged the runner every time it ran.

on:
  workflow_dispatch:
  push:
    branches: ['test/**']

permissions:
  contents: read

concurrency:
  group: duo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Build both schemes, unit tests on Duo
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      OUT: ${{ github.workspace }}/duo-out
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/duo-setup

      - name: Build App Store candidate for Duo
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild -project aPlusTerminal.xcodeproj -scheme aPlusTerminalAppStore \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath DD build 2>&1 \
            | tee "$OUT/build-appstore.log" | grep -E 'error:|BUILD (SUCCEEDED|FAILED)'

      - name: Build beta app and tests for Duo
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild -project aPlusTerminal.xcodeproj -scheme aPlusTerminal \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath DD build-for-testing 2>&1 \
            | tee "$OUT/build-beta.log" | grep -E 'error:|TEST BUILD (SUCCEEDED|FAILED)'

      # One simulator, never clones: parallel testing would boot extra copies
      # of the two-display Duo on a small VM.
      - name: Unit tests on Duo
        timeout-minutes: 20
        run: |
          set -o pipefail
          df -h / | tail -1; memory_pressure | tail -1
          xcodebuild -project aPlusTerminal.xcodeproj -scheme aPlusTerminal \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath DD \
            -only-testing:aPlusTerminalTests -resultBundlePath "$OUT/unit.xcresult" \
            -parallel-testing-enabled NO test-without-building 2>&1 \
            | tee "$OUT/unit.log" | grep -E 'error:|Executed .* tests|\*\* TEST (SUCCEEDED|FAILED)' | tail -20

      - name: Upload logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: duo-unit-logs
          path: ${{ env.OUT }}/*.log
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        timeout-minutes: 4
        run: '[ -z "${UDID:-}" ] || xcrun simctl delete "$UDID" || true'

  layout-ui:
    name: Duo layout UI test
    runs-on: xcode-27
    timeout-minutes: 50
    # checks: write is for the live log below — the only record that
    # survives when a preview VM freezes mid-step and takes the job's own
    # logs with it.
    permissions:
      contents: read
      checks: write
    env:
      OUT: ${{ github.workspace }}/duo-out
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/duo-setup

      # APLUSTERMINAL_DUO lands in the .xctestrun here (the scheme forwards
      # it), which is what test-without-building runs with.
      - name: Build beta app and UI tests for Duo
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild -project aPlusTerminal.xcodeproj -scheme aPlusTerminal \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath DD \
            APLUSTERMINAL_DUO=1 build-for-testing 2>&1 \
            | tee "$OUT/build-ui.log" | grep -E 'error:|TEST BUILD (SUCCEEDED|FAILED)'

      - name: Start loopback sshd and capture helper
        timeout-minutes: 6
        run: |
          scripts/duo-ci-sshd.sh start
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b | tail -1
          nohup scripts/duo-capture.sh "$UDID" "$OUT/shots" > "$OUT/duo-capture.log" 2>&1 &
          echo "DRIVER_PID=$!" >> "$GITHUB_ENV"

      # Facts first, bounded: what each display reports and how long a
      # screenshot of each takes, before a test depends on them.
      - name: Duo display inventory
        timeout-minutes: 6
        continue-on-error: true
        run: |
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          t 30 xcrun simctl io "$UDID" enumerate 2>&1 | grep -iE 'screen|display|power|name|size|port' | head -60
          for d in 1 3; do
            s=$SECONDS; t 20 xcrun simctl io "$UDID" screenshot --mask=ignored --display=$d "$OUT/shots/00-boot-display$d.png" >/dev/null 2>&1; echo "boot shot display $d rc=$? $((SECONDS-s))s"
          done

      # xcodebuild runs under a watchdog inside the step: progress is printed
      # as it happens (so a stall is visible in this step's log), and after
      # 14 minutes the run is stopped with a screenshot of both displays and
      # the app's recent log, so the job always reaches its later steps.
      - name: Duo layout UI test (fills the inner display; reshape mid-session)
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          # Live log: a check run on this commit whose summary is rewritten
          # every 20 s with the tail of what this step has seen.
          check=$(t 30 gh api "repos/$GITHUB_REPOSITORY/check-runs" -f name="Duo UI live log" \
            -f head_sha="$GITHUB_SHA" -f status=in_progress --jq .id 2>/dev/null || true)
          echo "live log check run: ${check:-none}"
          live() {
            [ -n "$check" ] || return 0
            python3 -I - "$OUT" > "$OUT/live.json" <<'PY'
          import json, os, sys
          out = sys.argv[1]
          def tail(name, n):
              try:
                  return "".join(open(os.path.join(out, name), errors="replace").readlines()[-n:])
              except OSError:
                  return "(none)\n"
          text = ("## watchdog\n```\n" + tail("watchdog.log", 40) + "```\n## xcodebuild (tail)\n```\n"
                  + tail("duo-ui.log", 120) + "```\n## capture helper\n```\n" + tail("duo-capture.log", 20) + "```\n")
          print(json.dumps({"output": {"title": "Duo UI test progress", "summary": text[-60000:]}}))
          PY
            t 20 gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check" --input "$OUT/live.json" >/dev/null 2>&1 || true
          }
          xcodebuild -project aPlusTerminal.xcodeproj -scheme aPlusTerminal \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath DD \
            -only-testing:aPlusTerminalUITests/DuoLayoutUITests -resultBundlePath "$OUT/duo-ui.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -parallel-testing-enabled NO APLUSTERMINAL_DUO=1 test-without-building > "$OUT/duo-ui.log" 2>&1 &
          pid=$!
          seen=0
          start=$SECONDS
          while kill -0 "$pid" 2>/dev/null; do
            sleep 20
            lines=$(wc -l < "$OUT/duo-ui.log")
            sed -n "$((seen + 1)),${lines}p" "$OUT/duo-ui.log" \
              | grep -E 'DUO:|error:|Test Case|Testing failed|hung|\*\* TEST' || true
            seen=$lines
            echo "[watchdog $((SECONDS - start))s] log lines=$lines; disk $(df -h / | awk 'NR==2 {print $4}') free; $(memory_pressure | tail -1); load $(sysctl -n vm.loadavg)" | tee -a "$OUT/watchdog.log"
            live
            if [ $((SECONDS - start)) -gt 840 ]; then
              echo "[watchdog] stopping a stalled run"
              for d in 1 3; do t 20 xcrun simctl io "$UDID" screenshot --mask=ignored --display=$d "$OUT/shots/zz-stalled-display$d.png" >/dev/null 2>&1 || true; done
              t 60 xcrun simctl spawn "$UDID" log show --last 3m --style compact \
                --predicate 'process == "aPlusTerminal" OR process CONTAINS "Runner" OR process == "testmanagerd"' \
                > "$OUT/stalled-sim.log" 2>&1 || true
              kill -INT "$pid" 2>/dev/null; sleep 20; kill -KILL "$pid" 2>/dev/null || true
              break
            fi
          done
          wait "$pid"; rc=$?
          echo "[watchdog] xcodebuild exited $rc" >> "$OUT/watchdog.log"
          live
          [ -z "$check" ] || t 20 gh api -X PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check" \
            -f status=completed -f conclusion=neutral >/dev/null 2>&1 || true
          tail -5 "$OUT/duo-ui.log"
          exit $rc

      # A skipped test is not a pass: both Duo tests must have RUN and passed.
      - name: Both Duo tests ran
        if: always()
        timeout-minutes: 4
        run: |
          [ -d "$OUT/duo-ui.xcresult" ] || { echo "no result bundle"; exit 1; }
          perl -e 'alarm shift; exec @ARGV' 120 xcrun xcresulttool get test-results tests --path "$OUT/duo-ui.xcresult" > "$OUT/duo-ui-tests.json"
          python3 -I - "$OUT/duo-ui-tests.json" <<'PY'
          import json, sys
          tree = json.load(open(sys.argv[1]))
          found = {}
          def walk(node):
              if node.get("nodeType") == "Test Case":
                  found[node["name"]] = node.get("result")
              for child in node.get("children", []):
                  walk(child)
          for root in tree["testNodes"]:
              walk(root)
          print(found)
          want = {"testUnfoldedWindowFillsTheInnerDisplay()", "testReshapingMidSessionResizesTheGrid()"}
          bad = {n: found.get(n) for n in want if found.get(n) != "Passed"}
          if bad:
              sys.exit(f"Duo tests did not pass: {bad}")
          PY

      - name: Export test screenshots
        if: always()
        timeout-minutes: 4
        run: |
          for r in duo-ui; do
            [ -d "$OUT/$r.xcresult" ] || continue
            perl -e 'alarm shift; exec @ARGV' 120 xcrun xcresulttool export attachments --path "$OUT/$r.xcresult" --output-path "$OUT/attachments/$r" || true
          done
          # Name the XCTest screenshots by their attachment names.
          python3 -I - "$OUT/attachments/duo-ui" "$OUT/shots" <<'PY'
          import json, os, shutil, sys
          src, dst = sys.argv[1], sys.argv[2]
          manifest = os.path.join(src, "manifest.json")
          if not os.path.exists(manifest):
              sys.exit(0)
          for test in json.load(open(manifest)):
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  if a["exportedFileName"].lower().endswith(".png"):
                      shutil.copy(os.path.join(src, a["exportedFileName"]), os.path.join(dst, "xctest-" + name.replace("/", "-")))
          PY
          ls -la "$OUT/shots"

      - name: Upload screenshots
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: duo-screenshots
          path: ${{ env.OUT }}/shots
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: duo-ui-logs
          path: |
            ${{ env.OUT }}/*.log
            ${{ env.OUT }}/*.json
            ${{ env.OUT }}/attachments
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        timeout-minutes: 4
        run: |
          echo "=== capture helper"; cat "$OUT/duo-capture.log" 2>/dev/null || true
          [ -z "${DRIVER_PID:-}" ] || kill "$DRIVER_PID" 2>/dev/null || true
          cat "$HOME/.aplus-duo/sshd.log" 2>/dev/null | tail -20 || true
          scripts/duo-ci-sshd.sh stop || true
          [ -z "${UDID:-}" ] || xcrun simctl delete "$UDID" || true
